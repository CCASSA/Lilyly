name: Lilyly Milestone APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/build-request.txt']
concurrency:
  group: lilyly-milestone
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the known-working Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preserve debug signing across milestone builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lilyly-debug-signing-v1
      - name: Test and assemble the milestone
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lilyly-test-results
          path: android/app/build/reports/tests/testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Lilyly-0.10.0-atmospheres-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lilyly-Garden-Preview-safe-side-by-side
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check connected journeys on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android :app:assembleDebugAndroidTest --stacktrace
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.lilyly.app.test/androidx.test.runner.AndroidJUnitRunner > instrument-results.txt
            cat instrument-results.txt
            mkdir -p ui-screenshots
            adb exec-out run-as com.lilyly.app cat files/cycle-wheel.png > ui-screenshots/cycle-wheel.png
            adb exec-out run-as com.lilyly.app cat files/cycle-calendar.png > ui-screenshots/cycle-calendar.png
            adb exec-out run-as com.lilyly.app cat files/cycle-log.png > ui-screenshots/cycle-log.png
            adb exec-out run-as com.lilyly.app cat files/sanctuary.png > ui-screenshots/sanctuary.png
            adb exec-out run-as com.lilyly.app cat files/scrapbook.png > ui-screenshots/scrapbook.png
            adb exec-out run-as com.lilyly.app cat files/tarot.png > ui-screenshots/tarot.png
            adb exec-out run-as com.lilyly.app cat files/bookshelf.png > ui-screenshots/bookshelf.png
            adb exec-out run-as com.lilyly.app cat files/reader.png > ui-screenshots/reader.png
            adb exec-out run-as com.lilyly.app cat files/sleep.png > ui-screenshots/sleep.png
            adb exec-out run-as com.lilyly.app cat files/home.png > ui-screenshots/home.png
            adb exec-out run-as com.lilyly.app cat files/medication.png > ui-screenshots/medication.png
            adb exec-out run-as com.lilyly.app cat files/therapy.png > ui-screenshots/therapy.png
            adb exec-out run-as com.lilyly.app cat files/notebooks.png > ui-screenshots/notebooks.png
            adb exec-out run-as com.lilyly.app cat files/themes.png > ui-screenshots/themes.png
            adb exec-out run-as com.lilyly.app cat files/day-threads.png > ui-screenshots/day-threads.png
            grep -q 'OK (' instrument-results.txt
            python3 -c "from pathlib import Path; assert all(p.read_bytes().startswith(bytes([137,80,78,71])) for p in Path('ui-screenshots').glob('*.png'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lilyly-device-check
          path: |
            instrument-results.txt
            ui-screenshots/
            android/app/build/reports/androidTests/connected/
