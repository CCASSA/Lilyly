name: Build Lilyly Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android.yml"
      - "source_bundle/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild Lilyly source bundle
        run: |
          cat source_bundle/part-*.b64 > Lilyly-source-build.zip
          unzip -t Lilyly-source-build.zip
          rm -rf build-src
          mkdir build-src
          unzip -q Lilyly-source-build.zip -d build-src
          sed -i 's/compileSdk = 37/compileSdk = 36/' build-src/Lilyly/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' build-src/Lilyly/app/build.gradle.kts
          printf '\nandroid.newDsl=false\n' >> build-src/Lilyly/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p build-src/Lilyly :app:assembleDebug --stacktrace

      - name: Upload Lilyly APK
        uses: actions/upload-artifact@v4
        with:
          name: Lilyly-debug-apk
          path: build-src/Lilyly/app/build/outputs/apk/debug/app-debug.apk
